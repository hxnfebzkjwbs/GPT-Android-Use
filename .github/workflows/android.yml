name: Android APK

on:
  push:
    branches:
      - main
      - feature/android-shell-bridge
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk GPT-Android-Use-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GPT-Android-Use-debug
          path: GPT-Android-Use-debug.apk
          if-no-files-found: error
