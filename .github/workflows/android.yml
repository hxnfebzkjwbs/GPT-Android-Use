name: Android APK

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Prepare exact launcher icon
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/res/drawable-nodpi
          cat             app/icon_source.000.b64             app/icon_source.001.b64             app/icon_source.002.b64             | base64 --decode             > app/src/main/res/drawable-nodpi/app_icon_source.png

      - name: Build both release APKs
        run: gradle --no-daemon assembleAdbRelease assembleAccessibilityRelease

      - name: Restore private signing key
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release-key.p12"
          chmod 600 "$RUNNER_TEMP/release-key.p12"

      - name: Sign both release APKs
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          ZIPALIGN="$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          test -n "$ZIPALIGN"

          "$ZIPALIGN" -f -p 4 app/build/outputs/apk/adb/release/app-adb-release-unsigned.apk "$RUNNER_TEMP/app-adb-release-aligned.apk"
          "$APKSIGNER" sign --ks "$RUNNER_TEMP/release-key.p12" --ks-key-alias "$ANDROID_KEY_ALIAS" --ks-pass env:ANDROID_KEYSTORE_PASSWORD --key-pass env:ANDROID_KEY_PASSWORD --out GPT-Android-Use-ADB-0.15.5.apk "$RUNNER_TEMP/app-adb-release-aligned.apk"

          "$ZIPALIGN" -f -p 4 app/build/outputs/apk/accessibility/release/app-accessibility-release-unsigned.apk "$RUNNER_TEMP/app-accessibility-release-aligned.apk"
          "$APKSIGNER" sign --ks "$RUNNER_TEMP/release-key.p12" --ks-key-alias "$ANDROID_KEY_ALIAS" --ks-pass env:ANDROID_KEYSTORE_PASSWORD --key-pass env:ANDROID_KEY_PASSWORD --out GPT-Android-Use-Accessibility-0.15.5.apk "$RUNNER_TEMP/app-accessibility-release-aligned.apk"

      - name: Verify private signing certificates
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED="21d060a53a5d9f810665d4c2a8f20cd418b48b237dadcca33570409e78443925"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          for APK in GPT-Android-Use-ADB-0.15.5.apk GPT-Android-Use-Accessibility-0.15.5.apk; do
            CERTS="$("$APKSIGNER" verify --verbose --print-certs "$APK" 2>&1)"
            echo "$CERTS"
            echo "$CERTS" | grep -Fi "$EXPECTED"
          done

      - name: Upload private-signed APKs
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: GPT-Android-Use-private-release
          path: |
            GPT-Android-Use-ADB-0.15.5.apk
            GPT-Android-Use-Accessibility-0.15.5.apk
          if-no-files-found: error
