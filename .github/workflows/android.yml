name: Android APK

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Restore fixed development signing key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          base64 --decode ci/fixed-debug.keystore.b64 > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk GPT-Android-Use-debug.apk

      - name: Verify APK signing certificate
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED="0d41fd1e54bfe4080c94255ffa769a371b4f409ba94aec6ae79cfc3169ab2011"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          ACTUAL="$("$APKSIGNER" verify --print-certs GPT-Android-Use-debug.apk | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')"
          echo "Signing SHA-256: $ACTUAL"
          test "$ACTUAL" = "$EXPECTED"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GPT-Android-Use-debug
          path: GPT-Android-Use-debug.apk
          if-no-files-found: error
