name: Android APK

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build unsigned release APK
        run: gradle --no-daemon assembleRelease

      - name: Restore private signing key
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release-key.p12"
          chmod 600 "$RUNNER_TEMP/release-key.p12"

      - name: Sign release APK
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          ZIPALIGN="$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          test -n "$ZIPALIGN"
          "$ZIPALIGN" -f -p 4             app/build/outputs/apk/release/app-release-unsigned.apk             "$RUNNER_TEMP/app-release-aligned.apk"
          "$APKSIGNER" sign             --ks "$RUNNER_TEMP/release-key.p12"             --ks-key-alias "$ANDROID_KEY_ALIAS"             --ks-pass env:ANDROID_KEYSTORE_PASSWORD             --key-pass env:ANDROID_KEY_PASSWORD             --out GPT-Android-Use-0.6.7.apk             "$RUNNER_TEMP/app-release-aligned.apk"

      - name: Verify private signing certificate
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED="21d060a53a5d9f810665d4c2a8f20cd418b48b237dadcca33570409e78443925"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          CERTS="$("$APKSIGNER" verify --verbose --print-certs GPT-Android-Use-0.6.7.apk 2>&1)"
          echo "$CERTS"
          echo "$CERTS" | grep -Fi "$EXPECTED"

      - name: Upload private-signed APK
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: GPT-Android-Use-private-release
          path: GPT-Android-Use-0.6.7.apk
          if-no-files-found: error
